# Postgres for integration tests: docker compose -f docker-compose.test.yml up -d --wait
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: bridge_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d bridge_test"]
      interval: 2s
      timeout: 5s
      retries: 15
